<div id="heat18" class="viz-dotted-background">
 <h2>微光方阵 · 天气与设备</h2>
 <div class="device"><canvas id="h18-screen" width="480" height="480" role="img" aria-label="Codex 用量方阵：待机、运行、等待处理与完成的动画预览"></canvas></div>
 <div class="controls" aria-label="场景"><button data-mode="idle" aria-pressed="true">待机</button><button data-mode="run" aria-pressed="false">运行</button><button data-mode="wait" aria-pressed="false">等你处理</button><button data-mode="done" aria-pressed="false">完成</button></div>
 <div class="controls"><button id="h18-demo">重播完整流程</button><button id="h18-return">完成 → 待机（加速）</button></div>
 <label class="usage">模拟本周用量 <input id="h18-usage" type="range" min="0" max="100" value="38" step="1"><output id="h18-value">38.0k</output></label>
 <div class="controls"><label>完成停留 <select id="h18-delay"><option value="120">2 分钟</option><option value="180" selected>3 分钟</option><option value="300">5 分钟</option></select></label><button id="h18-sound">试听 · 轻柔双音</button></div>
 <div class="note" id="h18-note" aria-live="polite">Stand by · 静态方块深浅对应模拟本周用量分布</div>
 <div class="note">本周 Token 热力图 · 用量、额度与天气均为示例 · 5H / Weekly 显示剩余比例</div>
<div class="weather-heading">第二页 · 天气优先</div>
<section data-variant="天气优先">
 <div class="device"><canvas width="480" height="480" role="img" aria-label="天气优先：天气上移、紧凑设备信息与四个硬盘容量槽位"></canvas></div>
 <div class="controls"><button id="h18-weather-replay">重播天气入场</button><button id="h18-page-demo">主屏 ↔ 天气页</button></div>
 <div class="controls"><button id="h18-disks">演示外接盘连接数</button><span id="h18-disk-state" class="note">电脑盘＋1 个外接盘</span></div>
 <div class="note">容量表示可用空间 · 灰色表示未连接 · 全部数据为模拟</div>
</section>
<style>
#heat18 .weather-heading{text-align:center;font-size:19px;font-weight:600;margin:28px 12px 20px}
#heat18 section{text-align:center;padding-bottom:20px}
#heat18 #h18-disk-state{padding:0;font-size:12px}
</style>


</div>
<style>
#heat18{font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:light-dark(#283c51,#e5e5ed);padding:14px 0 18px}
#heat18 h2{font-size:19px;font-weight:600;text-align:center;margin:0 0 20px}
#heat18 .device{width:min(400px,calc(100% - 24px));margin:auto;padding:13px;box-sizing:border-box;border-radius:33px;background:linear-gradient(145deg,#55555d,#24242c 43%,#3f3f47);border:1px solid #5c5c66;box-shadow:0 12px 22px #0003,inset 0 1px 1px #ffffff40}
#heat18 canvas{display:block;width:100%;aspect-ratio:1;border-radius:20px;background:#f4f7fb;touch-action:pan-y}
#heat18 .controls{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;align-items:center;margin:14px 12px 0}
#heat18 button,#heat18 select{font:inherit;font-size:12px;min-height:39px;padding:7px 11px;color:inherit;background:light-dark(#f7f6fa,#2b2935);border:1px solid light-dark(#d3d0df,#514b65);border-radius:8px}
#heat18 button{cursor:pointer}#heat18 button[aria-pressed=true]{background:light-dark(#306a9e,#cbdff0);color:light-dark(#fff,#244661);border-color:transparent}
#heat18 label{display:flex;align-items:center;gap:8px;font-size:12px}#heat18 .usage{max-width:365px;padding:0 18px;box-sizing:border-box;margin:16px auto 0}#heat18 input{accent-color:#397db8;min-width:60px;flex:1}#heat18 output{min-width:48px;font-variant-numeric:tabular-nums}
#heat18 .note{text-align:center;font-size:12px;color:light-dark(#686173,#b8b1c8);padding:14px 12px 0}
</style>
